<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-Learn TSM MUPA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="loading" id="loading">
      <div class="text-center">
        <div class="spinner"></div>
        <div class="mt-3">Memuat aplikasi...</div>
      </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toastContainer"
    ></div>
    <div id="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand border-bottom">
          <div class="brand-icon">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
          <div class="brand-text">
            <h4 class="text-white mb-0">e-Learn</h4>
            <small class="text-light">TSM MUPA</small>
          </div>
        </div>
        <nav class="menu flex-grow-1 p-3">
          <a href="#dashboard" class="btn btn-primary w-100 mb-2">
            <i class="bi bi-house-door"></i>
            <span class="nav-label">Dashboard</span>
          </a>

          <a href="#materi" class="btn btn-outline w-100 mb-2">
            <i class="bi bi-book"></i>
            <span class="nav-label">Materi</span>
          </a>

          <a href="#jobsheet" class="btn btn-outline w-100 mb-2">
            <i class="bi bi-clipboard-check"></i>
            <span class="nav-label">Jobsheet</span>
          </a>

          <a href="#siswa" class="btn btn-outline w-100 mb-2">
            <i class="bi bi-award"></i>
            <span class="nav-label">Cek Nilai</span>
          </a>

          <a href="#pengumuman" class="btn btn-outline w-100 mb-2">
            <i class="bi bi-megaphone"></i>
            <span class="nav-label">Pengumuman</span>
          </a>

          <a href="#cbt" class="btn btn-outline w-100 mb-2">
            <i class="bi bi-pencil-square"></i>
            <span class="nav-label">CBT</span>
          </a>
        </nav>

        <!-- KELUAR -->
        <div
          class="p-3 border-top"
          id="sidebarLogoutWrap"
          style="display: none"
        >
          <button
            type="button"
            id="sidebarLogoutBtn"
            class="btn btn-outline-danger w-100"
            onclick="logoutAllAccess()"
          >
            <i class="bi bi-box-arrow-right"></i>
            <span class="nav-label">Keluar</span>
          </button>
        </div>

        <!-- FOOTER -->
        <div class="sidebar-footer p-3 border-top text-center text-light small">
          App Version: v2.0.0
        </div>
      </aside>
      <div class="main">
        <header class="header">
          <button
            class="btn btn-outline"
            id="sidebarToggle"
            type="button"
            title="Toggle sidebar"
          >
            <i class="bi bi-list"></i>
          </button>

          <h5 id="pageTitle">Dashboard</h5>

          <div class="header-actions">
            <!-- STATUS AKSES -->
            <span
              id="accessStatus"
              class="badge bg-success-subtle text-success"
            >
              <i class="bi bi-globe2"></i>
              PUBLIC
            </span>

            <!-- AVATAR -->
            <div class="avatar">
              <i class="bi bi-person-fill"></i>
            </div>
          </div>
        </header>
        <main class="content">
          <div id="app-content">
            <div class="grid grid-4">
              <div class="card stat-card">
                <div>
                  <div class="stat-title">Siswa</div>
                  <div class="stat-value">0</div>
                </div>
                <div class="stat-icon"><i class="bi bi-people"></i></div>
              </div>
            </div>
          </div>

          <!-- ======================================================
     LOGIN ADMINISTRATOR
====================================================== -->

          <div
            id="adminLoginForm"
            class="card shadow-sm d-none"
            style="display: none"
          >
            <div class="card-body p-4">
              <div class="text-center mb-4">
                <div class="fs-1 text-primary">
                  <i class="bi bi-shield-lock-fill"></i>
                </div>

                <h4 class="mb-1">Login Administrator</h4>

                <div class="small text-muted">Masuk ke panel pengelola</div>
              </div>

              <div class="mb-3">
                <label for="adminUsername" class="form-label"> Username </label>

                <input
                  type="text"
                  id="adminUsername"
                  class="form-control"
                  placeholder="Username Administrator"
                  autocomplete="username"
                />
              </div>

              <div class="mb-3">
                <label for="adminPassword" class="form-label"> Password </label>

                <input
                  type="password"
                  id="adminPassword"
                  class="form-control"
                  placeholder="Password Administrator"
                  autocomplete="current-password"
                />
              </div>

              <button
                type="button"
                class="btn btn-primary w-100"
                onclick="loginAdministrator()"
              >
                <i class="bi bi-box-arrow-in-right"></i>
                Masuk Administrator
              </button>

              <button
                type="button"
                class="btn btn-link w-100 mt-2"
                onclick="hideAdminLogin()"
              >
                Kembali
              </button>
            </div>
          </div>
        </main>
        <footer class="app-footer">
          <span>© e-Learn TSM MUPA 2.0.0</span>

          <button
            type="button"
            class="admin-footer-btn"
            onclick="showAdminLogin()"
          >
            <i class="bi bi-shield-lock"></i>
            Administrator
          </button>
        </footer>
      </div>
    </div>
    <div class="modal fade" id="globalModal">
      <div class="modal-dialog modal-lg">
        <div class="modal-content" id="globalModalContent"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/core/config.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/services/storage.js"></script>
    <script src="js/utils/helper.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/components/loading.js"></script>
    <script src="js/modules/login/login.js"></script>
    <script src="js/modules/admin/admin.js"></script>
    <script src="js/modules/dashboard/dashboard.js"></script>
    <script src="js/modules/materi/materi.js"></script>
    <script src="js/modules/jobsheet/jobsheet.js"></script>
    <script src="js/modules/input/input.js"></script>
    <script src="js/modules/rekap/rekap.js"></script>
    <script src="js/modules/siswa/siswa.js"></script>
    <script src="js/modules/setting/setting.js"></script>
    <script src="js/core/app.js"></script>
  </body>
</html>
